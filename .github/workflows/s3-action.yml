# .github/workflows/deploy-to-s3.yml
name: Deploy to S3

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2 # London

      - name: Upload root directory to S3
        run: |
          aws s3 sync ./ s3://anthonyadesanwo.me/ --delete

      # Optional: Invalidate CloudFront Cache if using it
      # Replace ######## with your actual distribution ID
      - name: Invalidate CloudFront
        if: false # Change to true if you want to use this
        run: |
          aws cloudfront create-invalidation --distribution-id ######## --paths "/*"
  
    if: true
